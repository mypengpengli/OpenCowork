[package]
name = "opencowork-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
notify = "8.2"
opencowork-agents = { path = "../agents" }
opencowork-tools = { path = "../tools" }
walkdir.workspace = true
anyhow.workspace = true
axum.workspace = true
futures-core = "0.3"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
opencowork-api = { path = "../api" }
opencowork-app = { path = "../app" }
opencowork-commands = { path = "../commands" }
opencowork-mcp = { path = "../mcp" }
opencowork-runtime = { path = "../runtime" }
opencowork-skills = { path = "../skills" }
chrono = "0.4"
chrono-tz = "0.10"
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams",
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security",
    "Win32_System_Com", "Win32_System_StationsAndDesktops",
    "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
] }
