<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 多模式打字大冒险 6.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'ZCOOL KuaiLe', cursive, 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: #ffc1e3;
            overflow: hidden; height: 100vh;
            display: flex; flex-direction: column;
        }

        /* 游戏容器 */
        #game-container {
            flex: 1; position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            background-size: 200px 200px;
            transition: background 0.5s;
        }

        /* 背景风格 */
        .bg-pink {
            background-color: #ffc1e3;
            background-image: radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.4) 0%, transparent 10%),
                              radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.4) 0%, transparent 10%);
        }
        .bg-grass {
            background: #4caf50;
            background-image:
                linear-gradient(90deg, transparent 95px, rgba(0,0,0,0.1) 95px, rgba(0,0,0,0.1) 100px, transparent 100px),
                linear-gradient(0deg, transparent 95px, rgba(0,0,0,0.1) 95px, rgba(0,0,0,0.1) 100px, transparent 100px),
                radial-gradient(#558b2f 10%, transparent 11%),
                radial-gradient(#558b2f 10%, transparent 11%);
            background-size: 100px 100px, 100px 100px, 100px 100px, 100px 100px;
            background-position: 0 0, 0 0, 20px 20px, 70px 70px;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.2);
        }
        .bg-snake {
            background:
                radial-gradient(circle at 50% 42%, rgba(110, 255, 223, 0.14) 0%, rgba(110, 255, 223, 0) 36%),
                radial-gradient(circle at 20% 25%, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0) 14%),
                radial-gradient(circle at 78% 18%, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 12%),
                linear-gradient(180deg, #082c36 0%, #0d4b5b 48%, #11796f 100%);
            box-shadow: inset 0 0 120px rgba(0,0,0,0.18);
        }
        /* 添加家门口的木地板感 */
        .bg-grass::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 140px;
            background: #795548;
            background-image: repeating-linear-gradient(90deg, transparent, transparent 38px, #5d4037 38px, #5d4037 40px);
            border-right: 8px solid #3e2723;
            z-index: 1;
        }

        /* 震动 */
        .shake-hit { animation: shake-hit-anim 0.15s ease-in-out; }
        @keyframes shake-hit-anim {
            0% { transform: translate(0, 0); }
            25% { transform: translate(8px, 8px); }
            50% { transform: translate(-8px, -8px); }
            75% { transform: translate(8px, -8px); }
            100% { transform: translate(0, 0); }
        }

        #ui-layer {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100; pointer-events: none;
        }

        .stat-card {
            background: white; padding: 10px 25px; border: 4px solid #ff4081;
            border-radius: 30px; box-shadow: 0 6px 0px #f50057;
            font-size: 30px; color: #f50057; pointer-events: auto;
        }
        .stat-pvz { border-color: #2e7d32; color: #2e7d32; box-shadow: 0 6px 0 #1b5e20; }
        .stat-snake { border-color: #00796b; color: #00796b; box-shadow: 0 6px 0 #004d40; }

        .ui-right {
            display: flex; align-items: center; gap: 14px;
            pointer-events: auto;
        }
        .settings-btn {
            pointer-events: auto;
            background: white; border: 4px solid #ff4081;
            border-radius: 26px; cursor: pointer;
            box-shadow: 0 6px 0px #f50057;
            color: #f50057; font-weight: bold;
            font-size: 26px; line-height: 1;
            padding: 8px 14px;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .settings-btn:active { transform: translateY(2px); box-shadow: 0 4px 0px #f50057; }
        .settings-btn.pvz { border-color: #2e7d32; color: #2e7d32; box-shadow: 0 6px 0 #1b5e20; }
        .settings-btn.pvz:active { box-shadow: 0 4px 0 #1b5e20; }
        .settings-btn.snake { border-color: #00796b; color: #00796b; box-shadow: 0 6px 0 #004d40; }
        .settings-btn.snake:active { box-shadow: 0 4px 0 #004d40; }

        .lives-container { font-size: 45px; filter: drop-shadow(3px 3px 0 #fff); }

        #game-stage {
            flex: 1;
            position: relative;
            width: 100%;
            overflow: hidden;
            perspective: 1280px;
            perspective-origin: 50% 28%;
            isolation: isolate;
        }
        #game-stage::before,
        #game-stage::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            transition: transform 0.45s ease, opacity 0.45s ease, background 0.45s ease;
            z-index: 0;
        }
        #game-stage[data-mode="vertical"] {
            perspective-origin: 50% 14%;
        }
        #game-stage[data-mode="vertical"]::before {
            background:
                radial-gradient(circle at 18% 24%, rgba(255, 255, 255, 0.34) 0%, transparent 12%),
                radial-gradient(circle at 76% 18%, rgba(255, 255, 255, 0.26) 0%, transparent 10%),
                linear-gradient(180deg, rgba(255,255,255,0.18), transparent 42%);
            opacity: 0.7;
        }
        #game-stage[data-mode="vertical"]::after {
            left: 8%;
            right: 8%;
            top: auto;
            bottom: -22%;
            height: 42%;
            border-radius: 50%;
            background:
                radial-gradient(circle, rgba(255, 247, 174, 0.72) 0%, rgba(255, 210, 77, 0.34) 42%, rgba(255, 210, 77, 0) 72%),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.08) 0 18px, rgba(255,255,255,0) 18px 36px);
            transform: rotateX(78deg) translateZ(-140px);
            transform-origin: center top;
            opacity: 0.85;
        }
        #game-stage[data-mode="horizontal"] {
            perspective-origin: 18% 50%;
        }
        #game-stage[data-mode="horizontal"]::before {
            background:
                radial-gradient(circle at 12% 52%, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.06) 18%, rgba(255,255,255,0) 32%),
                linear-gradient(90deg, rgba(255,255,255,0.08), transparent 34%);
            opacity: 0.9;
        }
        #game-stage[data-mode="horizontal"]::after {
            inset: 14% 10% 12% -6%;
            background:
                repeating-linear-gradient(90deg, rgba(255,255,255,0.12) 0 12px, rgba(255,255,255,0) 12px 54px),
                linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0));
            transform: rotateY(72deg) translateZ(-300px);
            transform-origin: left center;
            opacity: 0.42;
        }
        #game-stage[data-mode="pvz"] {
            perspective-origin: 18% 36%;
        }
        #game-stage[data-mode="pvz"]::before {
            inset: auto -4% -12% -4%;
            height: 48%;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0)),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.08) 0 2px, rgba(0,0,0,0) 2px 68px),
                linear-gradient(90deg, rgba(255,255,255,0.06) 0 2px, rgba(0,0,0,0) 2px);
            background-size: auto, auto, 78px 100%;
            transform: rotateX(82deg) translateZ(-120px);
            transform-origin: center top;
            opacity: 0.88;
        }
        #game-stage[data-mode="pvz"]::after {
            background:
                radial-gradient(circle at 18% 44%, rgba(255,255,255,0.18) 0%, transparent 20%),
                linear-gradient(180deg, rgba(255,255,255,0.1), transparent 38%);
            opacity: 0.45;
        }
        #game-stage[data-mode="snake"] {
            perspective-origin: 50% 40%;
        }
        #game-stage[data-mode="snake"]::before {
            background:
                radial-gradient(circle at 50% 48%, rgba(132, 255, 225, 0.3) 0%, rgba(132, 255, 225, 0.08) 18%, rgba(132, 255, 225, 0) 40%),
                linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0) 36%);
            opacity: 0.9;
        }
        #game-stage[data-mode="snake"]::after {
            inset: 16% 12% 8% 12%;
            border-radius: 50%;
            background:
                radial-gradient(circle, rgba(5, 55, 54, 0.18) 0%, rgba(5, 55, 54, 0) 58%),
                repeating-radial-gradient(circle, rgba(255,255,255,0.12) 0 2px, rgba(255,255,255,0) 2px 48px),
                repeating-conic-gradient(from 0deg, rgba(255,255,255,0.06) 0deg 2deg, rgba(255,255,255,0) 2deg 18deg);
            transform: rotateX(78deg) translateZ(-160px);
            transform-origin: center center;
            opacity: 0.58;
        }

        /* 通用元素 */
        .game-item {
            position: absolute;
            z-index: 10;
            transform-style: preserve-3d;
            will-change: transform, opacity, filter;
        }

        /* 卡比星星 */
        .letter-star {
            position: relative;
            width: 88px; height: 88px;
            background: radial-gradient(circle at 35% 30%, #fffef8 0%, #fff59d 28%, #ffd54f 56%, #ffb300 100%);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 0 4px rgba(255, 245, 157, 0.35), 0 12px 24px rgba(255, 179, 0, 0.34);
            will-change: transform, filter;
            transform-style: preserve-3d;
        }
        .letter-star::before {
            content: '';
            position: absolute;
            inset: 10px 18px auto auto;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255,255,255,0.75);
            filter: blur(1px);
            animation: kirby-star-glimmer 1.2s infinite ease-in-out;
        }
        .letter-star::after {
            content: '';
            position: absolute;
            inset: auto 14px 16px auto;
            width: 18px;
            height: 18px;
            background: radial-gradient(circle, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0) 72%);
            animation: kirby-star-glimmer 1.5s infinite ease-in-out reverse;
        }
        .letter-star span {
            font-size: 32px;
            font-weight: bold;
            color: #4a2d00;
            margin-top: 5px;
            text-shadow: 0 2px 0 rgba(255,255,255,0.35);
            transform: translateZ(22px);
        }
        .star-0 { animation: kirby-star-twirl 1.9s infinite ease-in-out; }
        .star-1 { animation: kirby-star-twirl 1.6s infinite ease-in-out reverse; }
        .star-2 { animation: kirby-star-twirl 2.1s infinite ease-in-out; }
        .star-3 { animation: kirby-star-twirl 1.7s infinite ease-in-out reverse; }
        @keyframes kirby-star-glimmer {
            0%, 100% { transform: scale(0.8); opacity: 0.4; }
            50% { transform: scale(1.2); opacity: 1; }
        }
        @keyframes kirby-star-twirl {
            0%, 100% { filter: drop-shadow(0 8px 16px rgba(255, 179, 0, 0.28)); }
            50% { filter: drop-shadow(0 14px 24px rgba(255, 238, 88, 0.45)); }
        }

        /* 小动物/僵尸 */
        .target-item {
            width: 100px; height: 100px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: transform 0.1s linear;
            will-change: transform, opacity;
            transform-style: preserve-3d;
        }
        .target-sprite {
            font-size: 60px;
            filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.2));
            animation: target-bob 1s infinite ease-in-out;
            transform-style: preserve-3d;
        }
        @keyframes target-bob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }
        .target-item--vertical {
            width: 108px;
            height: 108px;
        }
        .target-item--vertical .target-sprite {
            font-size: 68px;
            transform: translateZ(30px);
        }
        .target-sprite--kirby-star {
            position: relative;
            animation: kirby-star-float 1.1s infinite ease-in-out;
            filter: drop-shadow(0 10px 18px rgba(255, 215, 64, 0.35));
        }
        .target-sprite--kirby-star::after {
            content: '';
            position: absolute;
            inset: 24px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 75%);
            z-index: -1;
        }
        @keyframes kirby-star-float {
            0%, 100% { transform: translateZ(28px) translateY(0) rotateX(12deg) rotateY(-10deg) rotate(-6deg) scale(1); }
            50% { transform: translateZ(40px) translateY(-8px) rotateX(16deg) rotateY(10deg) rotate(6deg) scale(1.06); }
        }
        .target-item--horizontal {
            width: 116px;
            height: 112px;
        }
        .target-item--horizontal .target-letter {
            top: -12px;
        }
        .target-sprite--animal {
            position: relative;
            z-index: 1;
            animation: animal-hover 0.95s infinite ease-in-out;
            filter: drop-shadow(0 10px 16px rgba(0,0,0,0.22));
            transform: translateZ(32px);
        }
        .target-shadow {
            position: absolute;
            bottom: 16px;
            width: 56px;
            height: 14px;
            border-radius: 50%;
            background: rgba(40, 40, 40, 0.18);
            filter: blur(2px);
            animation: animal-shadow 0.95s infinite ease-in-out;
            transform: translateZ(-20px);
        }
        @keyframes animal-hover {
            0%, 100% { transform: translateZ(26px) translateY(0) rotateX(10deg) rotateY(-14deg) rotate(0deg); }
            50% { transform: translateZ(40px) translateY(-8px) rotateX(18deg) rotateY(-4deg) rotate(3deg); }
        }
        @keyframes animal-shadow {
            0%, 100% { transform: scaleX(1); opacity: 0.18; }
            50% { transform: scaleX(0.82); opacity: 0.12; }
        }
        .target-item--pvz {
            width: 120px;
            height: 120px;
        }
        .target-item--pvz .target-sprite {
            width: 120px;
            height: 120px;
            display: grid;
            place-items: center;
            font-size: 0;
            filter: none;
            animation: none;
            will-change: filter;
        }
        .target-item--pvz .target-letter {
            top: -10px;
        }
        .target-item--snake {
            width: 126px;
            height: 126px;
        }
        .target-item--snake .target-letter {
            top: -10px;
        }
        .target-item--snake .target-sprite {
            width: 86px;
            height: 86px;
            display: block;
            font-size: 0;
            animation: snake-food-pulse 1.08s infinite ease-in-out;
            filter: drop-shadow(0 12px 18px rgba(0,0,0,0.24));
        }
        .target-sprite--snake {
            position: relative;
            border-radius: 50%;
            background:
                radial-gradient(circle at 34% 32%, #e9fff8 0%, #9ff8dc 26%, #35d5b7 58%, #00897b 100%);
            border: 3px solid #004d40;
            box-shadow:
                inset 0 0 0 5px rgba(255,255,255,0.2),
                0 0 0 6px rgba(103, 255, 219, 0.12);
        }
        .target-sprite--snake::before {
            content: '';
            position: absolute;
            inset: -11px;
            border-radius: 50%;
            border: 2px dashed rgba(168, 255, 234, 0.42);
            opacity: 0.72;
            animation: snake-food-ring 1.9s linear infinite;
        }
        .target-sprite--snake::after {
            content: '';
            position: absolute;
            inset: 13px 24px 34px 18px;
            border-radius: 999px;
            background: rgba(255,255,255,0.72);
            filter: blur(1px);
            transform: rotate(-22deg);
        }
        .snake-food-shadow {
            position: absolute;
            bottom: 18px;
            width: 56px;
            height: 14px;
            border-radius: 50%;
            background: rgba(5, 30, 33, 0.26);
            filter: blur(2px);
            transform: translateZ(-22px);
        }
        .pvz-zombie-svg {
            width: 118px;
            height: 118px;
            overflow: visible;
            transform: translateX(-6px) scaleX(-1);
            transform-origin: center;
            transition: transform 0.08s linear, filter 0.08s linear;
            will-change: transform, filter;
            transform-style: preserve-3d;
        }
        .pvz-zombie,
        .pvz-zombie * {
            transform-box: fill-box;
        }
        .pvz-zombie {
            --threat-lean: 0deg;
            --threat-lean-soft: 0deg;
            --threat-lean-tiny: 0deg;
            --threat-drop: 0px;
            --threat-shift: 0px;
            --arm-reach: 0deg;
            --arm-reach-soft: 0deg;
            --arm-reach-back: 0deg;
            --jaw-hunger: 0deg;
            --head-drop: 0px;
            --drag-depth: 0px;
            --lane-roll: 0deg;
            transform-origin: 50% 100%;
            animation: pvz-zombie-shamble var(--walk-duration, 0.86s) infinite ease-in-out;
            animation-delay: var(--phase-delay, 0s);
            filter: drop-shadow(5px 8px 0 rgba(0,0,0,0.22));
            will-change: transform;
        }
        .pvz-zombie__shadow {
            transform-origin: center;
            animation: pvz-shadow-breathe var(--walk-duration, 0.86s) infinite ease-in-out;
            animation-delay: var(--phase-delay, 0s);
        }
        .pvz-zombie__torso {
            transform-origin: 50% 78%;
            animation: pvz-torso-sway calc(var(--walk-duration, 0.86s) * 2) infinite ease-in-out;
            animation-delay: var(--phase-delay, 0s);
        }
        .pvz-zombie__head {
            transform-origin: 52% 82%;
            animation: pvz-head-bob var(--walk-duration, 0.86s) infinite ease-in-out;
            animation-delay: var(--phase-delay, 0s);
        }
        .pvz-zombie__eyes {
            transform-origin: center;
            animation: pvz-eye-blink 4.6s infinite ease-in-out;
            animation-delay: var(--phase-delay, 0s);
        }
        .pvz-zombie__jaw {
            transform-origin: 50% 0%;
            animation: pvz-jaw-chomp calc(var(--walk-duration, 0.86s) * 1.7) infinite ease-in-out;
            animation-delay: var(--phase-delay, 0s);
        }
        .pvz-zombie__arm--front {
            transform-origin: 88% 10%;
            animation: pvz-arm-front var(--walk-duration, 0.86s) infinite ease-in-out;
            animation-delay: var(--phase-delay, 0s);
        }
        .pvz-zombie__arm--back {
            transform-origin: 8% 12%;
            animation: pvz-arm-back var(--walk-duration, 0.86s) infinite ease-in-out;
            animation-delay: var(--phase-delay, 0s);
        }
        .pvz-zombie__leg--front {
            transform-origin: 50% 8%;
            animation: pvz-leg-front var(--walk-duration, 0.86s) infinite cubic-bezier(0.42, 0, 0.58, 1);
            animation-delay: var(--phase-delay, 0s);
        }
        .pvz-zombie__leg--back {
            transform-origin: 50% 8%;
            animation: pvz-leg-back var(--walk-duration, 0.86s) infinite cubic-bezier(0.42, 0, 0.58, 1);
            animation-delay: var(--phase-delay, 0s);
        }
        .pvz-zombie__prop--head {
            transform-origin: center bottom;
            animation: pvz-gear-bounce calc(var(--walk-duration, 0.86s) * 2) infinite ease-in-out;
            animation-delay: var(--phase-delay, 0s);
        }
        .pvz-zombie__prop--flag {
            transform-origin: 18% 92%;
            animation: pvz-flag-wave 1.1s infinite ease-in-out;
            animation-delay: var(--phase-delay, 0s);
        }
        .pvz-zombie__prop--shield {
            transform-origin: 75% 12%;
            animation: pvz-shield-rattle var(--walk-duration, 0.86s) infinite ease-in-out;
            animation-delay: var(--phase-delay, 0s);
        }
        @keyframes pvz-zombie-shamble {
            0%, 100% { transform: translateY(0) translateX(0) rotate(calc(var(--lane-roll) - var(--threat-lean))); }
            25% { transform: translateY(-3px) translateX(1px) rotate(calc(-2.2deg + var(--lane-roll) - var(--threat-lean))); }
            50% { transform: translateY(calc(1px + var(--threat-drop))) translateX(var(--threat-shift)) rotate(calc(0.8deg + var(--lane-roll) + var(--threat-lean))); }
            75% { transform: translateY(-2px) translateX(-1px) rotate(calc(0.6deg + var(--lane-roll) - var(--threat-lean-soft))); }
        }
        @keyframes pvz-shadow-breathe {
            0%, 100% { transform: scaleX(1); opacity: 0.32; }
            50% { transform: scaleX(0.82); opacity: 0.16; }
        }
        @keyframes pvz-torso-sway {
            0%, 100% { transform: rotate(calc(-1deg - var(--threat-lean))) translateY(0); }
            50% { transform: rotate(calc(3.8deg + var(--threat-lean))) translateY(-2px); }
        }
        @keyframes pvz-head-bob {
            0%, 100% { transform: rotate(calc(-3deg - var(--threat-lean-soft))) translateY(var(--head-drop)); }
            35% { transform: rotate(calc(4.5deg + var(--threat-lean-soft))) translateY(calc(-3px + var(--head-drop))); }
            70% { transform: rotate(calc(-6deg - var(--threat-lean))) translateY(calc(2px + var(--head-drop))); }
        }
        @keyframes pvz-eye-blink {
            0%, 90%, 100% { transform: scaleY(1); }
            93%, 97% { transform: scaleY(0.12); }
        }
        @keyframes pvz-jaw-chomp {
            0%, 100% { transform: rotate(0deg) translateY(0); }
            50% { transform: rotate(calc(10deg + var(--jaw-hunger))) translateY(3px); }
        }
        @keyframes pvz-arm-front {
            0%, 100% { transform: rotate(calc(22deg + var(--arm-reach))) translateY(0); }
            50% { transform: rotate(calc(-22deg + var(--arm-reach-soft))) translateY(3px); }
        }
        @keyframes pvz-arm-back {
            0%, 100% { transform: rotate(calc(-16deg + var(--arm-reach-back))) translateY(1px); }
            50% { transform: rotate(calc(24deg + var(--arm-reach-soft))) translateY(-2px); }
        }
        @keyframes pvz-leg-front {
            0%, 100% { transform: rotate(calc(14deg - var(--threat-lean-tiny))) translateY(var(--drag-depth)); }
            50% { transform: rotate(calc(-20deg - var(--threat-lean-tiny))) translateY(calc(3px + var(--drag-depth))); }
        }
        @keyframes pvz-leg-back {
            0%, 100% { transform: rotate(calc(-16deg - var(--threat-lean-tiny))) translateY(1px); }
            50% { transform: rotate(calc(17deg - var(--threat-lean-tiny))) translateY(-2px); }
        }
        @keyframes pvz-gear-bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }

        function syncSnakeSegments() {
            while (snakeState.segmentEls.length < snakeState.segmentCount) {
                const seg = document.createElement('div');
                seg.className = 'snake-segment';
                snakeBody.appendChild(seg);
                snakeState.segmentEls.push(seg);

            while (snakeState.segmentEls.length > snakeState.segmentCount) {

            }

        function resetSnakeState() {
            const metrics = getStageMetrics();
            snakeState.bodyScale = 1;
            snakeState.segmentCount = 10;
            snakeState.orbitAngle = Math.random() * Math.PI * 2;
            snakeState.angle = snakeState.orbitAngle + Math.PI / 2;
            snakeState.vx = 0;
            snakeState.vy = 0;
            snakeState.pulseUntil = 0;
            clearSnakeTarget();
            syncSnakeSegments();

            snakeState.headX = metrics.centerX + Math.cos(snakeState.orbitAngle) * 42;
            snakeState.headY = metrics.centerY + Math.sin(snakeState.orbitAngle * 1.18) * 30;
            snakeState.segments = [];
            for (let i = 0; i < snakeState.segmentCount; i++) {
                const dist = 18 + i * 15;
                snakeState.segments.push({
                    x: snakeState.headX - Math.cos(snakeState.angle) * dist,
                    y: snakeState.headY - Math.sin(snakeState.angle) * dist
                });
            }
            renderSnake(Date.now());
        }

        function renderSnake(now = Date.now()) {
            const pulseFactor = snakeState.pulseUntil > now
                ? 1 + ((snakeState.pulseUntil - now) / 420) * 0.08
                : 1;
            const total = Math.max(1, snakeState.segmentEls.length);

            for (let i = 0; i < snakeState.segmentEls.length; i++) {
                const segEl = snakeState.segmentEls[i];
                const seg = snakeState.segments[i];
                if (!seg) continue;

                const leader = i === 0 ? { x: snakeState.headX, y: snakeState.headY } : snakeState.segments[i - 1];
                const angle = Math.atan2(leader.y - seg.y, leader.x - seg.x);
                const ratio = i / total;
                const width = (42 - ratio * 22) * snakeState.bodyScale * pulseFactor;
                const height = (34 - ratio * 18) * snakeState.bodyScale * pulseFactor;
                const depth = 30 + (1 - ratio) * 24;

                segEl.style.width = `${width.toFixed(2)}px`;
                segEl.style.height = `${height.toFixed(2)}px`;
                segEl.style.left = `${(seg.x - width / 2).toFixed(2)}px`;
                segEl.style.top = `${(seg.y - height / 2).toFixed(2)}px`;
                segEl.style.zIndex = `${18 + i}`;
                segEl.style.transform = `translate3d(0, 0, ${depth.toFixed(2)}px) rotate(${angle.toFixed(4)}rad)`;
                segEl.style.filter = `brightness(${(0.94 + (1 - ratio) * 0.18).toFixed(2)}) saturate(${(0.92 + (1 - ratio) * 0.22).toFixed(2)})`;
            }

            const headLift = snakeState.targetItem ? 1.04 : (1 + Math.sin(now / 170) * 0.03);
            snakeHeadEl.style.left = `${(snakeState.headX - 31).toFixed(2)}px`;
            snakeHeadEl.style.top = `${(snakeState.headY - 27).toFixed(2)}px`;
            snakeHeadEl.style.transform = `translate3d(0, 0, 88px) rotate(${snakeState.angle.toFixed(4)}rad) scale(${(snakeState.bodyScale * headLift).toFixed(3)})`;
            if (snakeTongueEl) {
                const tongueScale = snakeState.targetItem ? 1.28 : (0.92 + Math.sin(now / 150) * 0.08);
                snakeTongueEl.style.transform = `translateX(-50%) scaleX(${tongueScale.toFixed(3)})`;
            }
        }

        function updateSnakeMovement(now) {
            const metrics = getStageMetrics();
            if (!snakeState.segmentEls.length) syncSnakeSegments();
            if (snakeState.targetItem && (!items.includes(snakeState.targetItem) || snakeState.targetItem.state !== 'targeted')) clearSnakeTarget();

            let goalX = metrics.centerX + Math.cos(snakeState.orbitAngle) * 42;
            let goalY = metrics.centerY + Math.sin(snakeState.orbitAngle * 1.18) * 30;
            let maxSpeed = 4.3;

            if (snakeState.targetItem) {
                goalX = snakeState.targetItem.x;
                goalY = snakeState.targetItem.y;
                maxSpeed = Math.min(14, 8.5 + snakeState.segmentCount * 0.12);
            } else {
                snakeState.orbitAngle += 0.046 * (speedMultiplier / 1.2);
            }

            const dx = goalX - snakeState.headX;
            const dy = goalY - snakeState.headY;
            const dist = Math.max(1, Math.hypot(dx, dy));
            const desiredAngle = Math.atan2(dy, dx);
            let delta = desiredAngle - snakeState.angle;
            while (delta > Math.PI) delta -= Math.PI * 2;
            while (delta < -Math.PI) delta += Math.PI * 2;
            snakeState.angle += delta * (snakeState.targetItem ? 0.22 : 0.12);

            const desiredSpeed = Math.min(maxSpeed, dist * 0.18 + 1.6);
            const desiredVX = Math.cos(snakeState.angle) * desiredSpeed;
            const desiredVY = Math.sin(snakeState.angle) * desiredSpeed;
            snakeState.vx = snakeState.vx * 0.76 + desiredVX * 0.24;
            snakeState.vy = snakeState.vy * 0.76 + desiredVY * 0.24;

            snakeState.headX = Math.min(metrics.width - 36, Math.max(36, snakeState.headX + snakeState.vx));
            snakeState.headY = Math.min(metrics.height - 36, Math.max(36, snakeState.headY + snakeState.vy));

            let leaderX = snakeState.headX;
            let leaderY = snakeState.headY;
            for (let i = 0; i < snakeState.segments.length; i++) {
                const seg = snakeState.segments[i];
                const segDx = leaderX - seg.x;
                const segDy = leaderY - seg.y;
                const segDist = Math.max(0.001, Math.hypot(segDx, segDy));
                const spacing = (14 + Math.max(0, 8 - i) * 0.6) * snakeState.bodyScale;
                const pull = Math.max(0, segDist - spacing) * 0.46;
                seg.x += (segDx / segDist) * pull;
                seg.y += (segDy / segDist) * pull;
                leaderX = seg.x;
                leaderY = seg.y;
            }

            renderSnake(now);

            if (snakeState.targetItem) {
                const eatDist = Math.hypot(snakeState.targetItem.x - snakeState.headX, snakeState.targetItem.y - snakeState.headY);
                if (eatDist < 34) finishHit(snakeState.targetItem, items.indexOf(snakeState.targetItem), snakeState.targetItem.x, snakeState.targetItem.y);
            }
        }

            const wobble = Math.sin(now / 180 + (it.poseSeed || 0)) * (it.state === 'targeted' ? 3.5 : 6);
            const yaw = Math.cos(now / 240 + (it.poseSeed || 0)) * (6 + dangerProgress * 8);
            const pitch = 12 + dangerProgress * 10;
            const scale = 1 + dangerProgress * 0.18 + (it.state === 'targeted' ? 0.12 : 0);

            it.element.style.left = `${(it.x - 63).toFixed(2)}px`;
            it.element.style.top = `${(it.y - 63).toFixed(2)}px`;
            it.element.style.transform = `translate3d(0, ${wobble.toFixed(2)}px, ${depth.toFixed(2)}px) rotateX(${pitch.toFixed(2)}deg) rotateY(${yaw.toFixed(2)}deg) scale(${scale.toFixed(3)})`;

            if (it.shadowEl) {

        function getWordTranslation(word) {
            return WORD_TRANSLATIONS[String(word || '').toLowerCase()] || '';
        }

        function parseCustomWordEntries(rawText) {
            const unique = new Map();
            const lines = String(rawText || '').split(/\r?\n/);

            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#')) continue;

                const parts = trimmed.split('=');
                const text = String(parts.shift() || '').trim().toLowerCase();
                const translation = String(parts.shift() || '').trim();
                const speech = parts.join('=').trim();

                if (!/^[a-z][a-z'-]*$/i.test(text)) continue;
                unique.set(text, {
                    text,
                    translation,
                    speechText: speech || text
                });
            }

            return Array.from(unique.values());
        }

        function rebuildCustomWordEntries() {
            customWordEntries = parseCustomWordEntries(settings.customWordsText);
            updateCustomWordsStatus();
        }

        function getWordPool(level) {
            const baseWords = (WORD_LISTS[level] || WORD_LISTS.easy).map((word) => ({
                text: word,
                translation: getWordTranslation(word),
                speechText: word
            }));

            const merged = new Map();
            for (const entry of baseWords) merged.set(entry.text.toLowerCase(), entry);
            for (const entry of customWordEntries) merged.set(entry.text.toLowerCase(), entry);
            return Array.from(merged.values());
        }

        function getWordLevel() {
            if (settings.promptMode === 'words_medium') return 'medium';
            if (settings.promptMode === 'words_hard') return 'hard';
            return 'easy';
        }

        function escapeHTML(str) {
            return String(str).replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        function renderPromptHTML(text, progress, translation = '') {
            if (!isWordMode()) return escapeHTML(text);

            const done = progress > 0 ? `<span class="prompt-typed">${escapeHTML(text.slice(0, progress))}</span>` : '';
            const rest = `<span class="prompt-rest">${escapeHTML(text.slice(progress))}</span>`;
            const translationHTML = translation ? `<span class="prompt-translation">${escapeHTML(translation)}</span>` : '';
            return `${done}${rest}${translationHTML}`;
        }

        function setWordFocus(it) {
            if (wordFocusItem?.element) wordFocusItem.element.classList.remove('word-focus');
            wordFocusItem = it;
            if (wordFocusItem?.element) wordFocusItem.element.classList.add('word-focus');
        }

        function getExpectedChar(it) {
            return (it.text?.[it.progress] || '').toLowerCase();
        }

        function findBestTypeTarget(key) {
            let best = null;
            if (gameMode === 'snake') {
                let minRadius = Infinity;
                for (const it of items) {
                    if (it.state !== 'falling') continue;
                    if (it.progress >= it.text.length) continue;
                    if (getExpectedChar(it) !== key) continue;
                    if (it.radius < minRadius) { minRadius = it.radius; best = it; }
                }
                return best;
            }
            if (gameMode === 'vertical') {
                let maxY = -Infinity;
                for (const it of items) {
                    if (it.state !== 'falling') continue;
                    if (it.progress >= it.text.length) continue;
                    if (getExpectedChar(it) !== key) continue;
                    if (it.y > maxY) { maxY = it.y; best = it; }
                }
                return best;
            }

            let minX = Infinity;
            for (const it of items) {
                if (it.state !== 'falling') continue;
                if (it.progress >= it.text.length) continue;
                if (getExpectedChar(it) !== key) continue;
                if (it.x < minX) { minX = it.x; best = it; }
            }
            return best;
        }

        function updatePromptUI(it) {
            const el = it.promptEl || it.element.querySelector('.target-letter');
            if (!el) return;
            it.promptEl = el;
            el.innerHTML = renderPromptHTML(it.text, it.progress, it.translation);
        }

        function randomPromptData() {
            if (!isWordMode()) {
                return {
                    text: CHAR_LIST[Math.floor(Math.random() * CHAR_LIST.length)],
                    translation: '',
                    speechText: ''
                };
            }

            const pool = getWordPool(getWordLevel());
            const picked = pool[Math.floor(Math.random() * pool.length)];
            return picked || { text: 'cat', translation: '猫', speechText: 'cat' };
        }

        function numToCN(n) {
            const cn = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
            if (n <= 9) return cn[n];
            if (n === 10) return '十';
            const tens = Math.floor(n / 10);
            const ones = n % 10;
            const tensPart = tens === 1 ? '十' : cn[tens] + '十';
            return ones === 0 ? tensPart : tensPart + cn[ones];
        }

        function productToKoujueCN(n) {
            // 口诀里常见写法：2×5=10 读作 “二五一十”
            if (n === 10) return '一十';
            return numToCN(n);
        }

        const TIMES_TABLE_PAIRS = [];
        for (let big = 1; big <= 9; big++) {
            for (let small = 1; small <= big; small++) {
                TIMES_TABLE_PAIRS.push([small, big]);
            }
        }

        function randomTimesTableLine() {
            const [small, big] = TIMES_TABLE_PAIRS[Math.floor(Math.random() * TIMES_TABLE_PAIRS.length)];
            const result = small * big;

            const left = `${numToCN(small)}${numToCN(big)}`;
            const right = productToKoujueCN(result);
            const koujue = result < 10 ? `${left}得${right}` : `${left}${right}`;

            const numeric = `${small}×${big}=${result}`;
            return { a: small, b: big, result, display: koujue, speak: koujue, numeric };
        }

        function speakText(text, opts = {}) {
            const { lang = 'zh-CN', rate = 1.0 } = opts;
            if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') return Promise.resolve(false);
            return new Promise((resolve) => {
                try {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = lang;
                    u.rate = rate;

                    const voices = window.speechSynthesis.getVoices?.() || [];
                    const langPrefix = String(lang).toLowerCase().split('-')[0];
                    const picked = voices.find(v => String(v.lang || '').toLowerCase().startsWith(langPrefix));
                    if (picked) u.voice = picked;

                    let done = false;
                    const finish = () => {
                        if (done) return;
                        done = true;
                        resolve(true);
                    };
                    u.onend = finish;
                    u.onerror = finish;

                    const timeoutMs = Math.min(6000, 600 + String(text).length * 180);
                    setTimeout(finish, timeoutMs);

                    window.speechSynthesis.speak(u);
                } catch (e) { resolve(false); }
            });
        }

        function applyPvzEnemyPose(it) {
            if (!it?.element) return;

            const stageWidth = Math.max(window.innerWidth, 1);
            const progress = Math.min(1, Math.max(0, 1 - (it.x / stageWidth)));
            const threat = Math.pow(progress, 1.18);
            const laneRoll = (it.row - 2) * 0.45;
            const now = Date.now();
            const frozen = !!(it.slowUntil && it.slowUntil > now);
            const stunned = !!(it.stunUntil && it.stunUntil > now);
            const staggerX = stunned ? Math.sin(now / 36 + (it.poseSeed || 0)) * 4.5 : 0;
            const staggerY = stunned ? -2 : 0;
            const staggerRotate = stunned ? Math.sin(now / 34 + (it.poseSeed || 0)) * 2.6 : 0;
            const depth = 22 + threat * 52;
            const pitch = 10 + threat * 8;
            const yaw = -12 - threat * 14;

            it.element.style.setProperty('--threat-lean', `${(7.4 * threat).toFixed(2)}deg`);
            it.element.style.setProperty('--threat-lean-soft', `${(4.4 * threat).toFixed(2)}deg`);
            it.element.style.setProperty('--threat-lean-tiny', `${(1.7 * threat).toFixed(2)}deg`);
            it.element.style.setProperty('--threat-drop', `${(5.2 * threat).toFixed(2)}px`);
            it.element.style.setProperty('--threat-shift', `${(9.5 * threat).toFixed(2)}px`);
            it.element.style.setProperty('--arm-reach', `${(18 * threat).toFixed(2)}deg`);
            it.element.style.setProperty('--arm-reach-soft', `${(7 * threat).toFixed(2)}deg`);
            it.element.style.setProperty('--arm-reach-back', `${(4 * threat).toFixed(2)}deg`);
            it.element.style.setProperty('--jaw-hunger', `${(9 * threat).toFixed(2)}deg`);
            it.element.style.setProperty('--head-drop', `${(7.5 * threat).toFixed(2)}px`);
            it.element.style.setProperty('--drag-depth', `${(4.2 * threat).toFixed(2)}px`);
            it.element.style.setProperty('--lane-roll', `${laneRoll.toFixed(2)}deg`);
            it.element.style.transform = `translate3d(${staggerX.toFixed(2)}px, ${staggerY}px, ${depth.toFixed(2)}px) rotateX(${pitch.toFixed(2)}deg) rotateY(${yaw.toFixed(2)}deg) rotate(${staggerRotate.toFixed(2)}deg)`;

            if (it.svgEl) {
                const spriteScale = 1 + threat * 0.08;
                const spriteNudge = -6 - threat * 6;
                it.svgEl.style.transform = `translateX(${spriteNudge.toFixed(2)}px) scaleX(-1) scale(${spriteScale.toFixed(3)})`;
                const filters = [
                    `saturate(${(1 + threat * 0.18).toFixed(2)})`,
                    `brightness(${(1 + threat * 0.12 + (stunned ? 0.06 : 0)).toFixed(2)})`
                ];
                if (frozen) filters.push('hue-rotate(165deg)', 'saturate(1.28)');
                it.svgEl.style.filter = filters.join(' ');
            }

            if (it.spriteEl) {
                it.spriteEl.style.filter = `drop-shadow(0 12px 18px rgba(0, 0, 0, ${(0.18 + threat * 0.18).toFixed(2)}))`;
            }
        }

        function applyVerticalTargetPose(it) {
            if (!it?.element) return;

            const stageHeight = Math.max(window.innerHeight, 1);
            const progress = Math.min(1, Math.max(0, (it.y + 100) / stageHeight));
            const wave = Math.sin(Date.now() / 220 + (it.poseSeed || 0));
            const drift = wave * (4 + progress * 5);
            const tilt = wave * (6 + progress * 8) + progress * 6;
            const scale = 1 + progress * 0.08;
            const glow = 0.9 + progress * 0.75;
            const depth = 10 + progress * 68;
            const pitch = 18 + progress * 22;
            const yaw = wave * (8 + progress * 12);

            it.element.style.transform = `translate3d(${drift.toFixed(2)}px, 0, ${depth.toFixed(2)}px) rotateX(${pitch.toFixed(2)}deg) rotateY(${yaw.toFixed(2)}deg) rotate(${tilt.toFixed(2)}deg) scale(${scale.toFixed(3)})`;
            if (it.element.classList.contains('letter-star')) {
                it.element.style.boxShadow = `0 0 0 4px rgba(255, 245, 157, ${(0.26 + progress * 0.16).toFixed(2)}), 0 12px 24px rgba(255, 179, 0, ${(0.24 + progress * 0.22).toFixed(2)})`;
            }
            if (it.spriteEl) it.spriteEl.style.opacity = glow.toFixed(2);
        }

        function applyHorizontalTargetPose(it) {
            if (!it?.element) return;

            const stageWidth = Math.max(window.innerWidth, 1);
            const progress = Math.min(1, Math.max(0, 1 - (it.x / stageWidth)));
            const wave = Math.sin(Date.now() / 180 + (it.poseSeed || 0));
            const hop = wave * (3 + progress * 6);
            const tilt = wave * (4 + progress * 8);
            const scaleX = 1 + progress * 0.08;
            const scaleY = 1 - progress * 0.06;
            const depth = 24 + progress * 80;
            const yaw = -26 + progress * 18;
            const pitch = 10 + progress * 8;

            it.element.style.transform = `translate3d(0, ${hop.toFixed(2)}px, ${depth.toFixed(2)}px) rotateX(${pitch.toFixed(2)}deg) rotateY(${yaw.toFixed(2)}deg) rotate(${tilt.toFixed(2)}deg) scale(${scaleX.toFixed(3)}, ${scaleY.toFixed(3)})`;
            if (it.spriteEl) {
                it.spriteEl.style.filter = `drop-shadow(0 12px 20px rgba(0, 0, 0, ${(0.18 + progress * 0.18).toFixed(2)}))`;
            }
            if (it.shadowEl) {
                const shadowScale = 1 - progress * 0.22 + Math.cos(Date.now() / 180 + (it.poseSeed || 0)) * 0.05;
                it.shadowEl.style.transform = `scaleX(${shadowScale.toFixed(3)})`;
                it.shadowEl.style.opacity = `${(0.16 - progress * 0.05).toFixed(2)}`;
            }
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, duration, type = 'sine', vol = 0.1) {
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function setSpeed(s) {
            speedMultiplier = s;
            document.querySelectorAll('#bottom-bar .btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            spawnInterval = 2200 / (s / 1.2);

        function createItem() {
            const prompt = randomPromptData();
            const promptHTML = renderPromptHTML(prompt.text, 0, prompt.translation);
            const div = document.createElement('div');
            let item = {
                element: div,
                text: prompt.text,
                translation: prompt.translation,
                speechText: prompt.speechText,
                progress: 0,
                state: 'falling',
                promptEl: null,
                spriteEl: null,
                svgEl: null,
                shadowEl: null,
                poseSeed: Math.random() * Math.PI * 2,
                hp: 1,
                maxHp: 1,
                baseSpeed: 0,
                slowUntil: 0,
                slowFactor: 1,
                stunUntil: 0
            };

            if (gameMode === 'vertical') {
                const x = Math.random() * (window.innerWidth - 150) + 75;
                if (isWordMode()) {
                    div.className = 'game-item target-item target-item--vertical';
                    div.innerHTML = `<div class="target-sprite target-sprite--kirby-star">⭐</div><div class="target-letter">${promptHTML}</div>`;
                    item.promptEl = div.querySelector('.target-letter');
                    item.spriteEl = div.querySelector('.target-sprite');
                } else {
                    div.className = 'game-item letter-star star-' + Math.floor(Math.random() * 4);
                    div.innerHTML = `<span>${escapeHTML(prompt.text)}</span>`;
                }
                div.style.left = `${x}px`; div.style.top = `-100px`;
                item.x = x; item.y = -100;
                item.speed = (Math.random() * 0.8 + 0.8) * (speedMultiplier / 1.2);
                applyVerticalTargetPose(item);
            } else if (gameMode === 'horizontal') {
                const y = Math.random() * (window.innerHeight - 300) + 100;
                const animal = animals[Math.floor(Math.random() * animals.length)];
                div.className = 'game-item target-item target-item--horizontal';
                div.innerHTML = `<div class="target-shadow"></div><div class="target-sprite target-sprite--animal">${animal}</div><div class="target-letter">${promptHTML}</div>`;
                item.promptEl = div.querySelector('.target-letter');
                item.spriteEl = div.querySelector('.target-sprite');
                item.shadowEl = div.querySelector('.target-shadow');
                div.style.left = `${window.innerWidth}px`; div.style.top = `${y}px`;
                item.x = window.innerWidth; item.y = y;
                item.speed = (Math.random() * 1.5 + 1.5) * (speedMultiplier / 1.2);
                applyHorizontalTargetPose(item);
            } else if (gameMode === 'pvz') {
                const row = Math.floor(Math.random() * 5);
                const y = (row + 1) * (window.innerHeight / 6) - 50;
                const zombieType = pvzZombieTypes[Math.floor(Math.random() * pvzZombieTypes.length)];
                const zombieStats = getPvzZombieStats(zombieType);
                const baseSpeed = (Math.random() * 1.2 + 1.2) * (speedMultiplier / 1.2);
                div.className = 'game-item target-item target-item--pvz';
                div.style.setProperty('--walk-duration', `${(zombieStats.cadence + (Math.random() * 0.08 - 0.04)).toFixed(2)}s`);
                div.style.setProperty('--phase-delay', `${(-Math.random() * 1.2).toFixed(2)}s`);
                div.innerHTML = `<div class="target-sprite">${getPvzZombieSvg(zombieType)}</div><div class="target-letter letter-pvz">${promptHTML}</div>`;
                item.promptEl = div.querySelector('.target-letter');
                item.spriteEl = div.querySelector('.target-sprite');
                item.svgEl = div.querySelector('.pvz-zombie-svg');
                div.style.left = `${window.innerWidth}px`; div.style.top = `${y - 8}px`;
                item.x = window.innerWidth; item.y = y - 8; item.row = row; item.zombieType = zombieType;
                item.baseSpeed = baseSpeed;
                item.speed = baseSpeed * zombieStats.speed;
                item.hp = zombieStats.hp;
                item.maxHp = zombieStats.hp;
                applyPvzEnemyPose(item);
            } else {
                const metrics = getStageMetrics();
                const safeRadius = getSnakeDangerRadius();
                const spawnRadius = Math.max(safeRadius + 48, Math.min(metrics.width, metrics.height) * (0.34 + Math.random() * 0.12));
                const angle = Math.random() * Math.PI * 2;
                const ellipse = 0.72 + Math.random() * 0.18;
                div.className = 'game-item target-item target-item--snake';
                div.innerHTML = `<div class="snake-food-shadow"></div><div class="target-sprite target-sprite--snake"></div><div class="target-letter letter-snake">${promptHTML}</div>`;
                item.promptEl = div.querySelector('.target-letter');
                item.spriteEl = div.querySelector('.target-sprite');
                item.shadowEl = div.querySelector('.snake-food-shadow');
                item.angle = angle;
                item.radius = spawnRadius;
                item.ellipse = ellipse;
                item.speed = (Math.random() * 0.42 + 0.42) * (speedMultiplier / 1.2);
                item.orbitSpeed = (Math.random() * 0.012 + 0.006) * (Math.random() < 0.5 ? -1 : 1);
                item.x = metrics.centerX + Math.cos(angle) * spawnRadius;
                item.y = metrics.centerY + Math.sin(angle) * spawnRadius * ellipse;
                applySnakeFoodPose(item);
            }
            stage.appendChild(div);
            return item;
        }

        function update() {
            if (!gameActive) return;
            const now = Date.now();
            if (gameMode === 'snake') {
                if (now - lastSpawn > spawnInterval && items.length < SNAKE_MAX_ITEMS) {
                    items.push(createItem());
                    lastSpawn = now;
                }

                const metrics = getStageMetrics();
                const dangerRadius = getSnakeDangerRadius();
                for (let i = items.length - 1; i >= 0; i--) {
                    const it = items[i];
                    if (it.state !== 'falling' && it.state !== 'targeted') continue;

                    it.radius -= it.state === 'targeted' ? it.speed * 0.15 : it.speed;
                    it.angle += it.orbitSpeed;
                    it.x = metrics.centerX + Math.cos(it.angle) * it.radius;
                    it.y = metrics.centerY + Math.sin(it.angle) * it.radius * it.ellipse;
                    applySnakeFoodPose(it, now);

                    if (it.state === 'falling' && it.radius < dangerRadius) {
                        if (wordFocusItem === it) setWordFocus(null);
                        it.element.remove();
                        items.splice(i, 1);
                        loseLife();
                    }
                }

                updateSnakeMovement(now);
                animationFrameId = requestAnimationFrame(update);
                return;
            }

            if (now - lastSpawn > spawnInterval) {
                items.push(createItem());
                lastSpawn = now;
            }

            for (let i = items.length - 1; i >= 0; i--) {
                const it = items[i];
                if (it.state === 'falling') {
                    if (gameMode === 'vertical') {
                        it.y += it.speed; it.element.style.top = `${it.y}px`;
                        applyVerticalTargetPose(it);
                        if (it.y > window.innerHeight - 150) { if (wordFocusItem === it) setWordFocus(null); it.element.remove(); items.splice(i, 1); loseLife(); }
                    } else {
                        if (gameMode === 'horizontal') {
                            it.x -= it.speed;
                            it.element.style.left = `${it.x}px`;
                            applyHorizontalTargetPose(it);
                        } else {
                            const isStunned = !!(it.stunUntil && it.stunUntil > now);
                            const speedFactor = it.slowUntil && it.slowUntil > now ? it.slowFactor : 1;
                            if (!isStunned) it.x -= it.speed * speedFactor;
                            it.element.style.left = `${it.x}px`;
                            applyPvzEnemyPose(it);
                        }
                        if (it.x < (gameMode === 'pvz' ? 150 : 50)) { if (wordFocusItem === it) setWordFocus(null); it.element.remove(); items.splice(i, 1); loseLife(); }
                    }
                } else if (it.state === 'inhaling') {
                    const kRect = kirbyCont.getBoundingClientRect();
                    const targetX = kRect.left + kRect.width / 2, targetY = kRect.top + kRect.height / 2;
                    const dx = targetX - it.x, dy = targetY - it.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 30) { finishHit(it, i, it.x, it.y); }
                    else {
                        it.x += dx * 0.02; it.y += dy * 0.02;
                        it.element.style.left = `${it.x}px`; it.element.style.top = `${it.y}px`;
                        it.element.style.transform = `scale(${dist/200}) rotate(${dist}deg)`;
                    }
                }
            }
            animationFrameId = requestAnimationFrame(update);
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 10 + 5;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.backgroundColor = color;
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 50 + 20;
                p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
                stage.appendChild(p);
                setTimeout(() => p.remove(), 600);

        function spawnCombatText(text, x, y, color = '#fff', stroke = '#333') {

        function resolvePvzHit(it, tx, ty) {

        }

        function loseLife() {
            lives--; playTone(150, 0.4, 'triangle', 0.2);
            container.classList.add('shake-hit'); setTimeout(() => container.classList.remove('shake-hit'), 150);
            updateLivesUI(); if (lives <= 0) gameOver();

        function updateLivesUI() {
            const icon = gameMode === 'pvz' ? '🌻' : (gameMode === 'snake' ? '🐍' : '🍓');

        function gameOver() {

        function resetGame() {
            setWordFocus(null);
            if (hintRestoreTimer) { clearTimeout(hintRestoreTimer); hintRestoreTimer = null; }
            try { window.speechSynthesis?.cancel?.(); } catch (e) {}
            hintText.textContent = getModeHintText(gameMode);
            gameActive = true; score = 0; lives = 5; kirbyScale = 1.0;
            resetKirbyPosition();

        function updateKirbyBody() {
            if (gameMode === 'pvz' || gameMode === 'snake') return;
            kirbyBody.setAttribute('r', 40 * kirbyScale);
            const offset = (kirbyScale - 1) * 15;
            document.getElementById('eyes').style.transform = `translateY(${-offset}px)`;
            mouthClosed.style.transform = `translateY(${-offset}px)`;
            mouthOpen.style.transform = `translateY(${-offset}px)`;
        }

        function shootPea(row, tx, ty, callback) {
            const pea = document.createElement('div');
            const type = getPvzShooterType(row);
            pea.className = type === 'melon' ? 'pea-bullet melon' : (type === 'corn' ? 'pea-bullet corn' : 'pea-bullet');

            const shooter = document.getElementById(`shooter-${row}`);
            const sRect = shooter ? shooter.getBoundingClientRect() : null;
            const size = type === 'melon' ? 46 : (type === 'corn' ? 30 : 32);
            const sx = sRect ? (sRect.left + sRect.width * (type === 'melon' ? 0.55 : (type === 'corn' ? 0.60 : 0.85))) : 250;
            const sy = sRect ? (sRect.top + sRect.height * (type === 'melon' ? 0.35 : (type === 'corn' ? 0.34 : 0.45))) : ((row + 1) * (window.innerHeight / 6) - 40);

            pea.style.left = `${sx - size / 2}px`; pea.style.top = `${sy - size / 2}px`;
            stage.appendChild(pea);

            const start = Date.now(), duration = type === 'melon' ? 700 : (type === 'corn' ? 650 : 600);
            const distance = Math.hypot(tx - sx, ty - sy);
            const arcHeight = type === 'melon'
                ? Math.min(220, Math.max(120, distance * 0.25))
                : (type === 'corn' ? Math.min(180, Math.max(90, distance * 0.22)) : 0);
            function anim() {
                const elapsed = Date.now() - start, progress = Math.min(elapsed / duration, 1);
                const x = sx + (tx - sx) * progress;
                let y = sy + (ty - sy) * progress;
                if (type === 'melon' || type === 'corn') y -= 4 * arcHeight * progress * (1 - progress);
                pea.style.left = `${x - size / 2}px`;
                pea.style.top = `${y - size / 2}px`;
                if (progress < 1) requestAnimationFrame(anim);
                else { pea.remove(); callback(); }
            }
            anim();
        }

        function shootStar(tx, ty, callback) {
            const p = document.createElement('div');
            p.className = 'projectile-star';
            const rect = kirbyCont.getBoundingClientRect();
            const size = 28;
            const sx = rect.left + rect.width / 2, sy = rect.top + rect.height / 2;
            p.style.left = `${sx - size / 2}px`; p.style.top = `${sy - size / 2}px`;
            stage.appendChild(p);

            const start = Date.now(), duration = 400;
            function anim() {
                const elapsed = Date.now() - start, progress = Math.min(elapsed / duration, 1);
                p.style.left = `${sx + (tx - sx) * progress - size / 2}px`;
                p.style.top = `${sy + (ty - sy) * progress - size / 2}px`;
                if (progress < 1) requestAnimationFrame(anim);
                else { p.remove(); callback(); }
            }
            anim();
        }

        function triggerAttack(it) {
            if (!it || it.state !== 'falling') return;
            if (gameMode === 'snake' && snakeState.targetItem && snakeState.targetItem !== it) return;

            const rect = it.element.getBoundingClientRect();
            const tx = rect.left + rect.width / 2;
            const ty = rect.top + rect.height / 2;

            if (gameMode !== 'snake') handleKillLearning(it);

            if (gameMode === 'vertical') {
                it.state = 'hit';
                mouthOpen.style.display = 'block'; mouthClosed.style.display = 'none';
                animateKirbyShoot();
                playTone(800, 0.1);
                shootStar(tx, ty, () => {
                    mouthOpen.style.display = 'none'; mouthClosed.style.display = 'block';
                    finishHit(it, items.indexOf(it), tx, ty);
                });
                return;
            }

            if (gameMode === 'horizontal') {
                mouthOpen.style.display = 'block'; mouthClosed.style.display = 'none';
                kirbyCont.style.top = `${ty}px`;
                animateKirbyInhale();
                playTone(400, 0.5);
                it.state = 'inhaling';
                for (let i = 0; i < 8; i++) {
                    const wind = document.createElement('div'); wind.className = 'inhale-wind';
                    wind.style.left = `${it.x}px`; wind.style.top = `${ty + (Math.random() - 0.5) * 180}px`;
                    wind.style.transform = `rotate(${Math.atan2((Math.random() - 0.5) * 180, -150) * 180 / Math.PI}deg)`;
                    stage.appendChild(wind); setTimeout(() => wind.remove(), 400);
                }
                return;
            }

            if (gameMode === 'snake') {
                clearSnakeTarget();
                snakeState.targetItem = it;
                it.state = 'targeted';
                it.element.classList.add('snake-targeted');
                snakeState.pulseUntil = Date.now() + 260;
                playTone(620, 0.08, 'square', 0.08);
                it.element.animate([
                    { transform: `${it.element.style.transform || 'translate3d(0, 0, 0)'}` },
                    { transform: 'translate3d(0, -8px, 68px) scale(1.12)' },
                    { transform: `${it.element.style.transform || 'translate3d(0, 0, 0)'}` }
                ], { duration: 220, easing: 'ease-out' });
                return;
            }

            // PVZ Mode
            it.state = 'hit';
            playTone(600, 0.1, 'square');
            const shooter = document.getElementById(`shooter-${it.row}`);
            shooter.animate([
                { transform: 'scale(1) translateX(0)' },
                { transform: 'scale(1.2) translateX(-10px)' },
                { transform: 'scale(1) translateX(0)' }
            ], { duration: 200, easing: 'ease-out' });
            shootPea(it.row, tx, ty, () => resolvePvzHit(it, tx, ty));
        }

        window.addEventListener('keydown', (e) => {
            if (settingsOverlay.style.display === 'flex') {
                if (e.key === 'Escape') closeSettings();
                return;
            }
            if (!gameActive) { if (e.key === 'Enter') resetGame(); return; }

            const key = e.key.toLowerCase(); // 统一转为小写比较，实现按键不分大小写
            if (key.length !== 1 || key < 'a' || key > 'z') return;

            if (isWordMode()) {
                if (wordFocusItem && (!items.includes(wordFocusItem) || wordFocusItem.state !== 'falling')) setWordFocus(null);

                let target = wordFocusItem;
                if (!target) {
                    target = findBestTypeTarget(key);
                    if (!target) return;
                    setWordFocus(target);
                }

                if (getExpectedChar(target) !== key) {
                    playTone(160, 0.05, 'square', 0.04);
                    return;
                }

                target.progress += 1;
                updatePromptUI(target);
                playTone(520, 0.04, 'sine', 0.06);

                if (target.progress < target.text.length) return;

                setWordFocus(null);
                triggerAttack(target);
                return;
            }

            const target = findBestTypeTarget(key);
            if (!target) return;
            triggerAttack(target);
        });

        function finishHit(it, idx, tx, ty) {
            if (gameMode === 'horizontal') {
                mouthOpen.style.display = 'none'; mouthClosed.style.display = 'block';
            }
            if (gameMode === 'snake') {
                handleKillLearning(it);
                if (snakeState.targetItem === it) clearSnakeTarget();
                const prevCount = snakeState.segmentCount;
                snakeState.segmentCount = Math.min(26, snakeState.segmentCount + 2);
                snakeState.bodyScale = Math.min(1.6, snakeState.bodyScale + 0.045);
                const growth = snakeState.segmentCount - prevCount;
                if (growth > 0) {
                    snakeState.segments.push(...Array.from({ length: growth }, () => {
                        const tail = snakeState.segments[snakeState.segments.length - 1] || { x: snakeState.headX, y: snakeState.headY };
                        return { x: tail.x, y: tail.y };
                    }));
                }
                syncSnakeSegments();
                snakeState.pulseUntil = Date.now() + 420;
            }
            container.classList.add('shake-hit'); setTimeout(() => container.classList.remove('shake-hit'), 100);
            playTone(gameMode==='pvz' ? 1000 : (gameMode === 'snake' ? 880 : 1300), 0.15);

            // 产生粒子效果
            const pColor = gameMode === 'pvz'
                ? (getPvzShooterType(it.row) === 'melon' ? '#ff5252' : (getPvzShooterType(it.row) === 'corn' ? '#ffeb3b' : '#81d4fa'))
                : (gameMode === 'snake' ? '#7ef9d3' : '#fff');
            createParticles(tx, ty, pColor);

            const h = document.createElement('div'); h.className = 'hit-text';
            if (gameMode === 'pvz') {
                const type = getPvzShooterType(it.row);
                h.textContent = type === 'melon' ? "砸! 🍉" : (type === 'corn' ? "啪! 🌽" : "咔嚓! ❄️");
            } else if (gameMode === 'snake') {
                h.textContent = "Grow! 🐍";
            } else {
                h.textContent = gameMode==='vertical'?"Poyo! ⭐":"真好吃! 😋";
            }
            if(gameMode==='pvz') {
                const type = getPvzShooterType(it.row);
                h.style.color = type === 'melon' ? '#ffeb3b' : (type === 'corn' ? '#fff8e1' : '#e1f5fe');
                h.style.webkitTextStroke = type === 'melon' ? '2px #1b5e20' : (type === 'corn' ? '2px #5d4037' : '2px #0d47a1');
            } else if (gameMode === 'snake') {
                h.style.color = '#d9fff6';
                h.style.webkitTextStroke = '2px #004d40';
            }
            h.style.left = `${tx}px`; h.style.top = `${ty}px`;
            stage.appendChild(h); setTimeout(() => h.remove(), 500);
            score += 10; scoreEl.textContent = score;
            const realIdx = items.indexOf(it); if(realIdx !== -1) items.splice(realIdx, 1);
            if (gameMode === 'vertical') {
                it.element.animate([
                    { transform: `${it.element.style.transform || 'none'}`, opacity: 1 },
                    { transform: 'scale(1.18) rotate(14deg)', opacity: 0.95, offset: 0.35 },
                    { transform: 'scale(0.2) rotate(26deg)', opacity: 0 }
                ], { duration: 180, easing: 'ease-out', fill: 'forwards' });
                setTimeout(() => it.element.remove(), 180);
            } else if (gameMode === 'horizontal') {
                animateKirbySwallow();
                it.element.animate([
                    { transform: `${it.element.style.transform || 'none'}`, opacity: 1 },
                    { transform: 'translate3d(-20px, -8px, 0) scale(0.42) rotate(-18deg)', opacity: 0.65 },
                    { transform: 'translate3d(-36px, -2px, 0) scale(0.12) rotate(-30deg)', opacity: 0 }
                ], { duration: 150, easing: 'ease-in', fill: 'forwards' });
                setTimeout(() => it.element.remove(), 150);
            } else if (gameMode === 'pvz') {
                spawnPvzDebris(it.zombieType, tx, ty);
                const deathTilt = Math.random() < 0.5 ? -14 : 14;
                it.element.animate([
                    { transform: 'translate3d(0, 0, 0) scale(1) rotate(0deg)', opacity: 1, filter: 'brightness(1)' },
                    { transform: 'translate3d(-16px, 6px, 0) scale(1.02) rotate(-4deg)', opacity: 1, filter: 'brightness(1.18)', offset: 0.4 },
                    { transform: `translate3d(-36px, 24px, 0) scale(0.88) rotate(${deathTilt}deg)`, opacity: 0, filter: 'brightness(0.9)' }
                ], { duration: 220, easing: 'cubic-bezier(0.2, 0.7, 0.2, 1)', fill: 'forwards' });
                setTimeout(() => it.element.remove(), 220);
            } else if (gameMode === 'snake') {
                snakeHeadEl.animate([
                    { transform: `translate3d(0, 0, 88px) rotate(${snakeState.angle.toFixed(4)}rad) scale(${snakeState.bodyScale.toFixed(3)})` },
                    { transform: `translate3d(0, 0, 104px) rotate(${snakeState.angle.toFixed(4)}rad) scale(${(snakeState.bodyScale * 1.08).toFixed(3)}, ${(snakeState.bodyScale * 0.92).toFixed(3)})` },
                    { transform: `translate3d(0, 0, 88px) rotate(${snakeState.angle.toFixed(4)}rad) scale(${snakeState.bodyScale.toFixed(3)})` }
                ], { duration: 220, easing: 'ease-out' });
                it.element.animate([
                    { transform: `${it.element.style.transform || 'translate3d(0, 0, 0)'}`, opacity: 1 },
                    { transform: 'translate3d(-8px, -12px, 92px) scale(0.56) rotate(16deg)', opacity: 0.9 },
                    { transform: 'translate3d(-18px, -18px, 40px) scale(0.08) rotate(34deg)', opacity: 0 }
                ], { duration: 220, easing: 'cubic-bezier(0.2, 0.7, 0.2, 1)', fill: 'forwards' });
                setTimeout(() => it.element.remove(), 220);
            } else {
                it.element.remove();
            }
            if (gameMode === 'horizontal') { kirbyScale += 0.04; if(kirbyScale > 2.0) kirbyScale = 2.0; updateKirbyBody(); }
        }

        changeMode('vertical');
    </script>
</body>
</html>
